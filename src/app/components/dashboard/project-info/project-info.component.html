<div class="horizontal-div">
  <div class="col-project-name">
    <div class="profile-section">
      <div class="projectName">
        <p class="name">{{projectInfo.name }}</p>
        <div class="project-date"><span class="material-symbols-outlined">calendar_month</span>
          {{formattedDate}}
        </div>
      </div>
      <div class="description">
        <p>{{ projectInfo.address }}</p>
      </div>
    </div>
  </div>

  <div class="col-assigned-user">
    <div class="AssignTo">
      <ng-container *ngFor="let member of projectInfo.assignedto; let i = index">
        <div *ngIf="i % 2 === 0">
          {{ projectInfo.assignedto[i]}}&nbsp;
          {{projectInfo.assignedto[i+1]}}
        </div>
      </ng-container>
    </div>
  </div>

  <div class="col-type">
    <div class="typeSection">
      <span *ngIf="projectInfo.projecttype === 'singlelevel'">Single</span>
      <span *ngIf="projectInfo.projecttype === 'multilevel'">Multi</span>
    </div>
  </div>

  <div class="col-assign-user-btn">
    <div class="AssignUser" (click)="openAssignProjectModal()">
      <span *ngIf="isAdmin" class="bi bi-person-circle icon" (click)="openAssignProjectModal()"
        title="Assign users to project"></span>
      <span class="AssignUsertext">Assign User&nbsp;</span>
      <span class="fas fa-chevron-down"></span>
    </div>
  </div>

  <div class="col-upload">
    <button class="btn btn-action-secondary btn-with-icon" (click)="openUploadFilesModal()" title="Upload project documents">
      <span class="material-symbols-outlined">upload</span>
      <span>Upload</span>
    </button>
  </div>

  <div class="col-reports">
    <button class="btn btn-action-primary btn-with-icon" (click)="openDownloadReportModal()" title="Download project reports">
      <span class="material-symbols-outlined">download</span>
      <span>Reports</span>
    </button>
  </div>

  <div class="col-complete">
    <span *ngIf="!projectInfo.iscomplete" class="bi bi-check2-square icon" (click)="markComplete()"
      title="Mark project complete"></span>
    <span *ngIf="projectInfo.iscomplete" class="bi bi-arrow-repeat icon" (click)="markComplete()"
      title="Move in progess"></span>
  </div>

  <div class="col-delete">
    <span class="bi bi-trash icon" title="Delete Project" (click)="deleteProject()"></span>
  </div>
</div>
