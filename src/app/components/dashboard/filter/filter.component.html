<div class="horizontal-div"> 
  <div class="right">
    <div class="filter-item">
      <input type="text" placeholder="Search by name"
           [(ngModel)]="searchTerm" (input)="filterNames()">
      <i class="material-symbols-outlined">
        search
      </i>
    </div>
    <div class="filter-item">
      <input type="date"  placeholder="Created on">
    </div>
    
    <button (click)="sortbyDate()" class="sortbyDate"
        title="sort projects by date"> 
        <i class="bi bi-sort-down custom-icon"></i>     
        Sort by date
    </button>
  
  </div>
    <div class="filter-item checkbox">
      <label>
        <input type="checkbox" [(ngModel)]="isChecked" (change)="filterCompletedProjects()"> Completed
      </label>    
    </div>
  </div>
